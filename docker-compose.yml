services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: firmato-frontend:latest
    container_name: firmato-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE=${API_BASE:?Defina API_BASE no arquivo .env antes de rodar o Docker. Veja .env.example}
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - firmato-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  firmato-net:
    external: true
